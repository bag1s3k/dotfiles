[project]
name = "confirm-logout"
version = "2026.0.0"
description = "A simple TUI to confirm before logging out"
readme = "README.md"
authors = [
    { name = "bag1s3k", email = "174890936+bag1s3k@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = ["textual>=8.2.8"]

[project.scripts]
confirm-logout = "confirm_logout:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyinstaller>=6.22.3", "ruff>=0.17.0", "textual-dev>=1.8.0"]
