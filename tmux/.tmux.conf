# ============================================
# ESSENTIAL SETTINGS
# ============================================
 
# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000
 
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
 
# Enable mouse support
set -g mouse on
 
# Enable focus events for vim autoread
set -g focus-events on
 
# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
 
# Aggressive resize for multi-client
setw -g aggressive-resize on
 
# ============================================
# KEY BINDINGS
# ============================================
 
# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
 
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
 
# Better pane splitting (and keep current path)
bind | split-window -h -c "$HOME"
bind - split-window -v -c "$HOME"
bind c new-window -c "$HOME"
 
# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# ============================================
# APPEARANCE
# ============================================

# Status bar position and basic style
set -g status-position top
set -g status-style 'bg=#A9B665'
set -g status-justify centre

# Segment lengths
set -g status-left-length 50
set -g status-right-length 50

# Left
set -g status-left '#[bg=#A9B665,fg=#1c1c1c,bold] #S'

# Right
set -g status-right '#[fg=#504945] %H:%M #[fg=#1d2021]• #[fg=#1d2021,bold]%d. %b. %Y '

# Inactive window
setw -g window-status-format '#[fg=#504945] #I • #W '

# Active window
setw -g window-status-current-format '#[fg=#1d2021,bold] #I • #W#{?window_zoomed_flag, [Z],} '

# Pane border colors
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#d8a567'

# Pane scrollbars (tmux 3.6+)
set -g pane-scrollbars off 

# Message styling
set -g message-style 'bg=#1d2021 fg=#A9B665 bold'

# ============================================
# COPY MODE
# ============================================
 
# Use vi keys
setw -g mode-keys vi
 
# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ============================================
# PLUGINS (via TPM)
# ============================================
 
# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
 
# Plugin settings
set -g @thumbs-command 'echo -n {} | wl-copy'
 
# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
