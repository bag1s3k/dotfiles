name: Update tracked apps table

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7

      - name: Run python script
        run: python ./.github/scripts/update_table.py
